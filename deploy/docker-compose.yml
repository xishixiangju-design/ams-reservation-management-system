version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: trae-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: trae_ams
      MYSQL_USER: ${DB_USER:-trae_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trae_pass}
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - trae-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 后端服务
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: trae-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trae_ams?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456} # 注意这里使用 root 密码或创建的用户
      TZ: Asia/Shanghai
    depends_on:
      - mysql
    networks:
      - trae-net

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: trae-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - trae-net

networks:
  trae-net:
    driver: bridge
