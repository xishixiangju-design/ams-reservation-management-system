server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 50 # Optimization for 20 concurrency

spring:
  application:
    name: ams-backend
  messages:
    basename: i18n/messages
    encoding: UTF-8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/trae_ams?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "123456" # Updated to actual password
    hikari:
      maximum-pool-size: 20 # Optimization for 20 concurrency
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis removed, using in-memory cache

  mail:
    host: smtp.163.com
    port: 465
    username: ins2192186145@163.com
    password: KJwVLt8FgvAC5dbv
    from: ins2192186145@163.com
    protocol: smtp
    default-encoding: utf-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true

jwt:
  secret: "trae_ams_secret_key_should_be_long_enough_for_hs256_algorithm" # Default secret
  expiration: 86400000 # 24 hours

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trae.ams.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # Enable SQL logging for dev

logging:
  level:
    com.trae.ams: DEBUG
    org.springframework: INFO

alipay:
  app-id: 9021000161666479 # Sandbox App ID (Example)
  private-key:  # Sandbox Private Key
  public-key:  # Alipay Public Key (支付宝公钥，不是应用公钥!)
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  return-url: http://localhost:3000/payment/result
  notify-url: http://localhost:8080/api/payment/alipay/notify # 必须是公网可访问地址 (e.g. using ngrok)，localhost无法接收支付宝回调
